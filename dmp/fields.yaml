## 2. Project information

project_type: TODO
project_slug: Lubricants-MD
project_title: "Bridging Time and Length Scales : From Atomistic Simulations to Constitutive Models"

# Official project start date in YYYY-MM-DD format, between single quotes.
project_start: '2025-10-01'

# Official project end date in YYYY-MM-DD format, between single quotes.
project_end: '2029-09-30'

# Abstract from the project application
project_abstract: |
  Molecular Dynamics (MD) simulations are able to simulate lubricants under operando conditions,
  but current analysis practices extract only limited information from finite,
  noisy trajectories and rarely quantify uncertainty, directionality, or cross-couplings.
  Consequently,
  state-of-the-art MD post-processing fails to reach its full potential in bridging the gap from atomistic time and length scales to macroscopic reality.

  This project establishes an uncertainty-aware MD framework with synthetic validation datasets for equilibrium MD,
  non-equilibrium MD,
  and the transient time correlation function method to obtain reliable transport properties.
  We quantify anisotropy and off-diagonal transport responses that emerge under symmetry breaking from shear, confinement, or compositional heterogeneity,
  identifying when scalar closures fail.
  This project identifies the structural and dynamical mechanisms that drive non-Newtonian rheology by linking changes in relaxation channels, cooperative motion, and molecular organization to changes in viscosity.

  Together, these advances transform MD outputs into validated and direction-resolved transport properties for continuum modeling, benchmarking of machine-learning potentials, and designing next-generation lubricants.


